<!doctype html>
<html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c2430" media="(max-width:1100px),(max-height:520px)">
<title>Equal Care Across Finland – county pathway twin</title>
<style>
:root{--ink:#1c2430;--mut:#5d6878;--line:#dfe3e8;--bg:#f4f5f7;--pan:#fff;--gap:#c8372d;--watch:#e0a030;--ok:#4f9d7c;--unid:#aab1bb;--none:#e9ecef;--m3:#6b5fb5;--m4:#0e7c86;--nat:#7a8594;--hh:64px;--sw:540px;
 --g1:#8fb4e6;--g2:#5a8fd6;--g3:#2a66b3;--g4:#12407a}   /* --g1..4: the four rungs of the decision ladder, one hue, darker = a higher forum */
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
header{background:var(--ink);color:#fff;padding:12px 20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:25}
header h1{font-size:30px;margin:0;font-weight:800;letter-spacing:-.015em;line-height:1.05}header .sub{font-size:12px;opacity:.85;margin-top:3px}
.ctl{display:flex;gap:10px;align-items:center;margin-left:auto;flex-wrap:wrap}
.tp{display:contents}#subm{display:none}   /* .tp: play, slider and date; on phones they become the bar at the bottom of the screen (see the end of this sheet) */
button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 11px;cursor:pointer;color:var(--ink)}
button.on{background:var(--ink);color:#fff;border-color:var(--ink)}header button{border-color:#fff3}
header .ghost{background:transparent;color:#fff;border-color:#ffffff55}header .ghost:hover,header .ghost.active{background:#fff;color:var(--ink)}
#play{background:#fff;font-weight:650;min-width:84px}#slider{width:340px}#date{font-variant-numeric:tabular-nums;font-weight:650;font-size:16px;min-width:92px}
main{padding:14px 20px 40px;max-width:1900px;margin:auto;display:grid;gap:14px;transition:padding .28s}
.row{display:grid;gap:14px}.r1{grid-template-columns:minmax(380px,460px) 1fr}.r2{grid-template-columns:1fr 1fr}.r3{grid-template-columns:1.25fr 1fr}.r4{grid-template-columns:1fr 1fr 1fr}
@media(max-width:1100px){.r1,.r2,.r3,.r4{grid-template-columns:1fr}}
.pan{background:var(--pan);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
h2{font-size:15px;margin:0 0 2px}h3{font-size:13px;margin:12px 0 4px}.cap{color:var(--mut);font-size:12.5px;margin:2px 0 8px}.cap:empty{display:none}
.chip{display:inline-block;border-radius:11px;padding:1px 9px;font-size:12.5px;font-weight:600;border:1px solid #c3ccd6;background:#edf2f7;color:var(--ink);margin:0 3px 3px 0;cursor:pointer;white-space:nowrap}
.chip:hover,.chip.active{border-color:var(--ink);background:var(--ink);color:#fff}
.st{display:inline-block;border-radius:4px;padding:0 7px;font-size:12px;font-weight:650;color:#fff;white-space:nowrap}
.st.g{background:var(--gap)}.st.w{background:var(--watch);color:#3a2800}.st.o{background:var(--ok)}.st.u{background:repeating-linear-gradient(45deg,#aab1bb 0 4px,#c9ced5 4px 8px);color:#222}.st.s,.st.n,.st.x{background:var(--none);color:var(--mut);border:1px dashed #b5bcc6}
.path{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin:8px 0 4px}
.stepb{position:relative;border-radius:8px;padding:8px 10px;color:#fff;cursor:pointer;min-height:58px;border:2px solid transparent}
.stepb.sel{border-color:var(--ink)}.stepb b{display:block;font-size:13px}.stepb span{font-size:12px}
.path .stepb:not(:last-child)::after{content:"→";position:absolute;right:-16px;top:16px;color:var(--mut);font-size:16px}
.stepb.g{background:var(--gap)}.stepb.w{background:var(--watch);color:#3a2800}.stepb.o{background:var(--ok)}.stepb.u{background:repeating-linear-gradient(45deg,#aab1bb 0 5px,#c3c8cf 5px 10px);color:#1c2430}.stepb.x,.stepb.s,.stepb.n{background:var(--none);color:var(--mut);border:2px dashed #b5bcc6}
table{border-collapse:collapse;width:100%;font-size:12.5px}th,td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-weight:600;font-size:11.5px}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.rec{border:1px solid var(--line);border-left:5px solid var(--gap);border-radius:8px;padding:9px 12px;margin:8px 0;background:#fffdfc}
.rec.w{border-left-color:var(--watch)}.rec.q{border-left-color:var(--unid)}
.rec .flow{font-size:12px;color:var(--mut);margin-bottom:3px}.rec .act{font-weight:650;font-size:14.5px;margin:2px 0 6px}
.rec dl{display:grid;grid-template-columns:118px 1fr;gap:2px 10px;margin:0;font-size:12.5px}.rec dt{color:var(--mut)}.rec dd{margin:0}
.brief{background:#f3f6fa;border:1px solid #d9e1ea;border-radius:8px;padding:9px 12px;margin:8px 0;font-size:13.5px}
.brief p{margin:0 0 5px}.brief .tag{font-size:11.5px;color:var(--mut)}
svg text{font-family:inherit}.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:4px;align-items:center}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.big{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}.kpis{display:flex;gap:22px;margin:4px 0 6px}.kpis div span{display:block;font-size:11.5px;color:var(--mut)}
.ne{color:var(--mut);font-style:italic}.win{font-weight:700}.note{font-size:12px;color:var(--mut)}
/* compact dashboard: short labels on the page, long text in the side panel */
.ptitle{display:flex;align-items:center;gap:8px;margin:0 0 4px}.ptitle h2{margin:0}
.ptitle.twin{align-items:baseline;gap:10px;margin:0 0 8px}.ptitle.twin h2{font-size:27px;font-weight:800;letter-spacing:-.01em;line-height:1.1}.ptitle.twin h2 span{font-weight:500;color:var(--mut)}.ptitle.twin .info{align-self:center}
.info{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--mut);font:italic 700 12px/1 Georgia,"Times New Roman",serif;padding:0;cursor:pointer;vertical-align:1px;margin-left:6px;flex:none}
.info:hover,.info.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.teaser{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:12px 0 4px;cursor:pointer;background:#f7f9fb;transition:border-color .15s,background .15s}
.teaser .ic{color:var(--m4);font-size:15px}.teaser .lab{font-weight:650;white-space:nowrap}.teaser .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mut)}
.go{color:var(--mut);font-size:18px;line-height:1}
.teaser:hover,.teaser.active,.scard:hover,.scard.active,.lp:hover,.lp.active{border-color:var(--ink)}
.teaser.active,.scard.active{box-shadow:0 0 0 2px #1c243022}
.links{margin-top:10px;font-size:12.5px}.links a,a.lnk{color:var(--m4);cursor:pointer;margin-right:14px;text-decoration:none;font-weight:600}.links a:hover,a.lnk:hover{text-decoration:underline}
.dline{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:12.5px;color:var(--mut);margin-top:6px}
.dchip{border:1px solid var(--line);border-radius:999px;padding:3px 12px;background:#fff;color:var(--ink);cursor:pointer}.dchip.win{border-color:var(--m4);background:#e8f4f5}
.sgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.scard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:#fff;transition:border-color .15s;min-width:0}
.scard .k{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:650}.scard b{display:block;font-size:22px;font-variant-numeric:tabular-nums;margin:2px 0}.scard .v{font-size:12.5px;color:var(--mut)}
.scard.win{border-top:4px solid var(--m4)}.scard.tie{border-top:4px solid var(--unid)}.scard.loss{border-top:4px solid var(--m3)}
.pillrow{display:flex;flex-wrap:wrap;gap:6px}.lp{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 4px;font-size:12.5px;cursor:pointer;background:#fff}
#foot a{margin-left:6px}
/* the county twin as a circuit: one stage per pathway step, one block per signal; darker = more relevant now */
#card{container-type:inline-size}
.circuit{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 18px;margin:12px 0 4px;align-items:start}
.stage{min-width:0}.stage .stepb{min-height:0;padding:7px 10px;margin:0 0 8px}
.stage:not(:last-child) .stepb::after{content:"→";position:absolute;right:-17px;top:11px;color:var(--mut);font-size:16px}
@container (max-width:880px){.circuit{grid-template-columns:repeat(2,minmax(0,1fr))}.stage:nth-child(2n) .stepb::after{display:none}}
@container (max-width:470px){.circuit{grid-template-columns:1fr}.stage .stepb::after{display:none}}
.hb{border:1px solid var(--line);border-radius:10px;padding:9px 11px 10px;margin:0 0 8px;cursor:pointer;min-width:0;transition:background-color .5s,color .5s,box-shadow .15s}
.hb:hover,.hb.active{box-shadow:0 0 0 2px #1c243066}
.hb .hh{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 8px;align-items:flex-start}.hb .hval{white-space:nowrap}.hb .hh .st{flex:none;margin-top:4px}
.hb .hval{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.hb .hn{display:block;font-size:13px;margin-top:1px}
.wev{margin:16px 0 4px;padding-top:12px;border-top:1px solid var(--line)}
.wevg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:8px}
.wevc{display:grid;grid-template-columns:74px minmax(0,1fr);gap:11px;align-items:start;border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:#fff}
.wevc .dots{width:74px;height:74px}.wevc .wbig{display:block;font-size:20px;line-height:1.15;font-variant-numeric:tabular-nums}.wevc p{margin:3px 0 4px;font-size:12.5px;line-height:1.45}
.wevf{margin:8px 0 0;font-size:12px;line-height:1.5}
@media (max-width:1100px){.wevg{grid-template-columns:1fr}}
.hb .hval small{font-size:12px;font-weight:600;opacity:.75}
.pbar{position:relative;height:9px;border-radius:5px;margin:8px 0 3px;background:color-mix(in srgb,currentColor 14%,transparent)}
.pbar>i{display:block;height:100%;border-radius:5px;min-width:2px;transition:width .5s}
.pbar .tk{position:absolute;top:-3px;width:2px;height:15px;margin-left:-1px;border-radius:1px;background:currentColor}
.pbar .tk.fl{background:repeating-linear-gradient(currentColor 0 3px,transparent 3px 5px)}.pbar .tk.tg{background:var(--m4);width:3px}.hb.dk .pbar .tk.tg{background:#7fd6dc}
.pbar.judge{background:repeating-linear-gradient(45deg,color-mix(in srgb,currentColor 10%,transparent) 0 4px,color-mix(in srgb,currentColor 20%,transparent) 4px 8px)}
.pbar.judge>i{background:color-mix(in srgb,currentColor 55%,transparent)}
.jrow{display:flex;align-items:center;gap:7px}.jrow .pbar{flex:1}.jrow .jn{font-size:11px;font-weight:700;opacity:.8;margin-top:5px}
.hcap .kw{white-space:nowrap}.hb .hcap{font-size:11.5px;line-height:1.45;opacity:.85;font-variant-numeric:tabular-nums}
.hcap .kk{display:inline-block;width:2px;height:10px;margin:0 4px -1px 0;background:currentColor}.hcap .kk.fl{background:repeating-linear-gradient(currentColor 0 2px,transparent 2px 4px)}.hcap .kk.tg{width:3px;background:var(--m4)}.hb.dk .hcap .kk.tg{background:#7fd6dc}
.hb .hnat{font-size:11.5px;opacity:.78;font-variant-numeric:tabular-nums;margin-top:1px}
.hb .hm{margin:3px 0 0;font-size:11.5px;line-height:1.5}.hb .hm>span{opacity:.72}
.hb .chip{font-size:11px;padding:0 7px;margin:0 2px 0 0;vertical-align:1px}.hb.dk .chip{background:#ffffff26;color:#fff;border-color:#ffffff70}.hb .chip:hover{background:#fff;color:var(--ink);border-color:#fff}
.hb .hev{margin-top:6px;font-size:11.5px;font-weight:400}
.hb .hwhy,.hb .hneed{margin-top:8px;padding-top:7px;border-top:1px solid #1c243024;font-size:12.5px;line-height:1.45}
.hb .lbl{display:inline-block;width:100%;font-size:10px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;opacity:.65;margin-bottom:1px}
.hb .hneed{font-weight:650}.hb .hneed[data-open]:hover,.hb .hneed.active{text-decoration:underline}.hb .hneed.off{font-weight:400;opacity:.8}
.hb .go{color:inherit;font-size:15px}
.hb.dk{color:#fff;border-color:transparent}.hb.dk .hwhy,.hb.dk .hneed{border-top-color:#ffffff38}
.howkey{font-size:12px;color:var(--mut);margin-top:2px}
/* side panel */
#side{position:fixed;top:var(--hh);right:0;bottom:0;width:min(var(--sw),100vw);background:#fff;z-index:20;border-left:1px solid var(--line);box-shadow:-16px 0 40px rgba(28,36,48,.12);transform:translateX(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
body.side-open #side{transform:none}
body.noanim #side,body.noanim main{transition:none!important}
#side .sh{padding:18px 18px 14px 24px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;justify-content:space-between;background:linear-gradient(180deg,#f7f9fb,#fff)}
#side .kick{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);font-weight:650}
#side h2{font-size:20px;line-height:1.25;margin:4px 0 0;font-weight:700}
#side .tools{display:flex;gap:6px;flex:none}
#side .tools button{width:32px;height:32px;padding:0;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:14px;line-height:1}
#side .tools button:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
#side .sb{overflow:auto;padding:18px 24px 48px;font-size:14.5px;line-height:1.6}
#side .sb p{margin:0 0 10px}#side .lead{font-size:16.5px;font-weight:600;line-height:1.45}
#side .sec{margin:22px 0 0}#side .sec>h4{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);margin:0 0 8px;font-weight:650}
#side .facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
#side .fact .st{font-size:14px;padding:2px 10px;line-height:1.5;margin:3px 0}
#side .fact{background:#f5f7f9;border-radius:10px;padding:10px 12px;min-width:0}#side .fact b{display:block;font-size:21px;font-variant-numeric:tabular-nums;line-height:1.2}#side .fact>span{display:block;font-size:11.5px;color:var(--mut);margin-top:2px}
#side .kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:7px 14px;margin:0;font-size:14px}#side .kv dt{color:var(--mut)}#side .kv dd{margin:0;overflow-wrap:anywhere}
#side .item{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 10px}#side .ihead{display:flex;gap:8px;align-items:baseline;margin-bottom:6px}
#side .gb{font-size:11px;font-weight:700;color:#fff;background:var(--ink);border-radius:999px;padding:1px 8px;white-space:nowrap}
#side .bp p{padding-left:12px;border-left:3px solid #d9e1ea}
#side ul{padding-left:18px;margin:0}#side li{margin:0 0 6px}#side a{color:var(--m4)}
#side .legrow{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center}
.scrim{display:none}
@media(max-width:1279px){body.side-open .scrim{display:block;position:fixed;inset:var(--hh) 0 0 0;background:rgba(28,36,48,.28);z-index:19}}
@media(min-width:1280px){body.side-open main{padding-right:calc(var(--sw) + 20px)}}
/* intro popup: the page behind is blurred and cannot be used until Play is pressed */
.intro{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;background:rgba(28,36,48,.42)}
.intro[hidden]{display:none}
body.intro-open{overflow:hidden}
body.intro-open header,body.intro-open main,body.intro-open #side{filter:blur(7px);pointer-events:none;user-select:none}
header{transition:filter .35s}main{transition:padding .28s,filter .35s}
.introcard{background:#fff;border-radius:24px;padding:26px 34px 22px;width:min(470px,100%);max-height:calc(100vh - 28px);overflow:auto;text-align:center;box-shadow:0 30px 80px rgba(28,36,48,.5)}
.brandbig{font-size:54px;font-weight:800;letter-spacing:-.025em;line-height:1.05;margin:4px 0 6px}.introcard .tag{color:var(--mut);font-size:14px;line-height:1.45;margin:0 0 18px}
.introcard .kick{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:650}
.introcard h2{font-size:30px;line-height:1.15;margin:14px 0 0;font-weight:750;cursor:pointer}
.bigplay{width:112px;height:112px;border-radius:50%;border:0;background:var(--ink);color:#fff;display:inline-grid;place-items:center;cursor:pointer;position:relative;padding:0 0 0 8px;transition:background .15s,transform .15s}
.bigplay::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:3px solid var(--ink);opacity:0;animation:ring 1.8s ease-out infinite}
@keyframes ring{0%{transform:scale(.88);opacity:.6}100%{transform:scale(1.2);opacity:0}}
.bigplay:hover{background:var(--m4);transform:scale(1.04)}.bigplay:focus-visible{outline:3px solid var(--m4);outline-offset:5px}
.howto{text-align:left;margin:20px 0 14px;padding:14px 16px 12px;background:#f4f6f8;border-radius:14px}.howto h3{margin:0 0 9px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);font-weight:650}
.howto ol{margin:0;padding:0;list-style:none;counter-reset:h}.howto li{counter-increment:h;display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;font-size:14px;line-height:1.4;margin:0 0 8px}
.howto li::before{content:counter(h);width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.tourbtn{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;margin:6px 0 0;padding:9px 14px;border:1.5px solid var(--ink);border-radius:12px;background:#fff;font-weight:700;font-size:14.5px;text-align:left;line-height:1.3}
.tourbtn small{display:block;font-weight:400;color:var(--mut);font-size:12.5px;margin-top:1px}.tourbtn .go{font-size:22px;color:inherit}.tourbtn:hover,.tourbtn:focus-visible{background:var(--ink);color:#fff}.tourbtn:hover small,.tourbtn:focus-visible small{color:#ffffffcc}
.introlang{display:inline-flex;gap:4px;background:#eef1f4;border-radius:999px;padding:3px}
.introlang button{border:0;background:transparent;border-radius:999px;padding:4px 16px;font-size:13px;color:var(--mut)}
.introlang button.on{background:#fff;color:var(--ink);font-weight:650;box-shadow:0 1px 3px #0003}
.howto li .lnk{margin:0;padding:0;border:0;background:none;font:inherit;font-weight:650;color:var(--m4);cursor:pointer;text-align:left}.howto li .lnk:hover{text-decoration:underline}
/* About: page 1 of the circuit document (visuals/circuit/circuit-p1.svg); a click opens it full screen */
.circ{margin:0}.circ button{display:block;width:100%;padding:0;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:zoom-in;overflow:hidden}
.circ button:hover,.circ button:focus-visible{border-color:var(--m4);outline:none;box-shadow:0 0 0 2px #0e7c8633}.circ img{display:block;width:100%;height:auto}
.circ figcaption{font-size:12px;color:var(--mut);line-height:1.5;margin-top:7px}
#lightbox{position:fixed;inset:0;z-index:80;background:#fff;overflow:auto;display:grid;place-items:center;padding:16px;cursor:zoom-out}
#lightbox[hidden]{display:none}body.lb-open{overflow:hidden}
#lightbox img{display:block;width:min(calc(100vw - 32px),calc((100vh - 32px) * 1.4142));height:auto}
#lightbox .x{position:fixed;top:12px;right:12px;width:36px;height:36px;padding:0;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:15px;line-height:1;cursor:pointer;box-shadow:0 2px 8px #0002}
#lightbox .x:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
@media(max-width:899px){#lightbox{place-items:start}#lightbox img{width:1200px;max-width:none}}
.introcard.nudge{animation:nudge .32s}@keyframes nudge{0%,100%{transform:scale(1)}45%{transform:scale(1.035)}}
@media(prefers-reduced-motion:reduce){.bigplay::before,.introcard.nudge{animation:none}}
/* how-to showcase: a spotlight that walks through the page, with one card of explanation per stop */
#spot{position:fixed;z-index:55;border-radius:14px;pointer-events:none;box-shadow:0 0 0 3px #fff,0 0 0 8px #89cff0,0 0 0 9999px rgba(20,28,38,.62)}
#spot[hidden],#tourcard[hidden]{display:none}body.tour-on main{padding-bottom:70vh}

.rung{display:flex;flex-direction:column;min-width:0;border:1px solid var(--line);border-top:4px solid var(--rc);border-radius:10px;padding:10px 12px 9px;background:#fff}
.rung.r1{--rc:var(--g1);margin-top:36px}.rung.r2{--rc:var(--g2);margin-top:24px}.rung.r3{--rc:var(--g3);margin-top:12px}.rung.r4{--rc:var(--g4)}   /* each rung starts 12px higher: a staircase */

.rh{display:grid;grid-template-columns:24px minmax(0,1fr) 54px;column-gap:9px;align-items:start}
.smap{display:block;width:54px;height:auto}.smap.xs{width:30px;flex:none}
.rh .rs{display:block;font-size:12px;line-height:1.35;color:var(--ink);font-weight:600;margin-top:3px}
.uhr{display:inline-block;width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 2.5px #c8372d;margin:0 4px -1px 0;background:#fff}
.rfirst{margin-top:9px;font-size:12.5px;line-height:1.4}.rfirst .lbl{display:block;font-size:10px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--mut);margin-bottom:3px}
.rfirst ol{margin:0;padding:0;list-style:none;counter-reset:f}.rfirst li{counter-increment:f;position:relative;padding-left:22px;margin:0 0 4px}
.rfirst li::before{content:counter(f);position:absolute;left:0;top:1px;width:16px;height:16px;border-radius:50%;background:var(--rc);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center}.r1 .rfirst li::before{color:var(--ink)}
.rthen{margin:6px 0 0;color:var(--mut)}.rthen b{color:var(--ink);font-weight:650}
.gfirst{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;counter-reset:gf}
.gfirst li{counter-increment:gf;display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 11px 9px 34px;position:relative;cursor:pointer;background:#fff}
.gfirst li::before{content:counter(gf);position:absolute;left:9px;top:9px;width:18px;height:18px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.gfirst li:hover{border-color:var(--ink)}.gfirst li b{display:block;font-size:13.5px;line-height:1.3}.gfirst .fw{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);margin-top:2px}
.gfirst p{margin:4px 0 2px;font-size:12.5px;line-height:1.4}.gfirst .note{font-size:11.5px}.gfirst li.ask{background:#f4f6f8}.askic{flex:none;width:30px;height:30px;border-radius:8px;background:#e3e6ea;display:grid;place-items:center;font-weight:800;color:var(--mut)}
.rn{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:700;background:var(--rc);color:#fff}.r1 .rn{color:var(--ink)}
.yloc{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;align-items:center;margin:9px 0 0;padding:8px;border-radius:8px;background:#f4f7fb}
.locmap{display:block;width:100%;height:auto}.locmap.big{max-width:250px;margin:4px auto 6px}
.yk{display:flex;align-items:baseline;gap:6px;font-size:12px;line-height:1.35;margin:2px 0}.yk i{flex:none;width:10px;height:10px;border-radius:2px}.yk i.ring{border-radius:50%;background:#fff;box-shadow:inset 0 0 0 2.5px #c8372d}
.locfig{margin:8px 0 4px}.locfig figcaption{font-size:12.5px;color:var(--mut);line-height:1.45;text-align:center}
.rh b{font-size:14.5px;line-height:1.3}.rh .ry{display:block;font-size:12px;line-height:1.35;color:var(--mut);margin-top:2px}.rh .rw{display:block;font-size:12.5px;line-height:1.35;margin-top:4px}
.rung dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 9px;margin:9px 0 0;font-size:12.5px;line-height:1.4}
.rung dt,.rnow .lbl{font-size:10px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--mut)}.rung dt{padding-top:2px}.rung dd{margin:0}
.rnow{margin-top:auto;padding-top:10px}.rnow .lbl{display:block;margin-bottom:4px}.rnow .none{font-size:12.5px;color:var(--mut)}   /* at the foot of every rung, so the county's signals line up along the staircase */
.rall{font-size:11.5px;color:var(--mut);margin-top:3px}
.gchip{display:inline-flex;flex-wrap:wrap;align-items:baseline;gap:0 6px;max-width:100%;border:1.5px solid var(--ink);border-radius:8px;padding:3px 9px;margin:0 4px 4px 0;background:var(--ink);color:#fff;font-size:12.5px;line-height:1.4;cursor:pointer}
.gchip b{font-weight:650}.gchip i{font-style:normal;font-size:12px;opacity:.85}.gchip.o{background:#fff;color:var(--ink);border-color:#aab1bb}
.gchip:hover,.gchip.active,.gchip:focus-visible{box-shadow:0 0 0 2px #1c243055;outline:none}
.gchip.moved{animation:gmove .5s ease-out}@keyframes gmove{0%{transform:translateY(9px);opacity:.25;box-shadow:0 0 0 0 #5a8fd6}100%{transform:none;opacity:1;box-shadow:0 0 0 9px #5a8fd600}}   /* a signal that has just changed rung */
.tracks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.trk{display:flex;flex-direction:column;min-width:0;border-radius:10px;background:#f4f6f8;padding:9px 12px 8px;font-size:12.5px;line-height:1.4;color:var(--mut)}
.trk>b{font-size:13.5px;color:var(--ink)}.trk .rnow{padding-top:7px}.trk .rall{margin-top:0}
/* decision trail: one row per signal, one bar per stretch of months; taller and darker = a higher forum */
.trail{display:grid;grid-template-columns:max-content minmax(0,1fr);column-gap:12px;align-items:end}
.trail .tl{font-size:12.5px;line-height:1.2;padding:0 0 3px;text-align:right;white-space:nowrap;cursor:pointer}.trail .tl:hover,.trail .tl.active,.trail .tl:focus-visible{text-decoration:underline;outline:none}
.trail .tq{position:relative;height:28px;border-bottom:1px solid #c3ccd6;cursor:pointer}
.trail .tq i,.tsw i{position:absolute;bottom:0;box-sizing:border-box;border-radius:2px 2px 0 0}.trail .tq i{border-right:1px solid #fff}
.k1{height:6px;background:var(--g1)}.k2{height:11px;background:var(--g2)}.k3{height:16px;background:var(--g3)}.k4{height:21px;background:var(--g4)}
.trail .tq i.kH,.tsw i.kH{height:11px;background:#fff;border:1.5px solid var(--g2);border-bottom:0}
.kX{height:17px;background:linear-gradient(var(--ink),var(--ink)) center/2px 100% no-repeat}.kX::after{content:"";position:absolute;left:50%;top:-3px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--ink)}
.trail .tq i.kD,.trail .tq i.kS,.tsw i.kD,.tsw i.kS{height:4px;border-radius:0}.kD{background:repeating-linear-gradient(45deg,#aab1bb 0 3px,#d5d9df 3px 6px)}.kS{background:repeating-linear-gradient(90deg,#aab1bb 0 2px,transparent 2px 5px)}
.trail .tyr{position:relative;height:18px}.trail .tyr span{position:absolute;top:3px;margin-left:3px;font-size:11px;color:var(--mut)}
.tleg{display:flex;flex-wrap:wrap;gap:2px 16px;align-items:flex-end;font-size:12px;color:var(--mut);margin-top:6px}.tleg>span{display:inline-flex;align-items:flex-end;gap:6px;white-space:nowrap;line-height:1.2}
.tsw{position:relative;display:inline-block;flex:none;width:14px;height:21px}.tsw i{left:0;width:100%}
.sgrid.gk{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.scard.gk{border-top:4px solid var(--g3)}
#gov .links{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px 0}#gov .links a{white-space:nowrap}#gov .gnote{margin:8px 0 0;max-width:1080px}
@container (max-width:1000px){.ladder,.tracks{grid-template-columns:1fr 1fr}.rung.r1,.rung.r2,.rung.r3{margin-top:0}.trail .tyr .alt{display:none}}
@container (max-width:560px){.ladder,.tracks{grid-template-columns:1fr;gap:8px}.rung:not(.on) dl{display:none}.rung:not(.on) .rnow{padding-top:6px}.rung:not(.on) .rnow .lbl,.rung:not(.on) .rnow .none{display:none}   /* a rung holding nothing now folds to its name and its trigger */
 .trk:not(.on)>span{display:none}.trk:not(.on) .rnow{padding-top:2px}
 .trail{grid-template-columns:minmax(0,1fr)}.trail .tl{text-align:left;white-space:normal;padding:8px 0 0}.trail .tq{height:25px}.trail>span:empty{display:none}}
@media(prefers-reduced-motion:reduce){.gchip.moved{animation:none}}

.gtag.s{background:#e1f0f1;color:#0b5c63}.gtag.p{background:#fcefd9;color:#7a4a00}.gtag.u{background:#eef0f3;color:var(--mut)}
#side .gladder{list-style:none;margin:0;padding:0}
#side .gladder li{display:grid;grid-template-columns:26px minmax(0,1fr);column-gap:10px;padding:9px 0;border-bottom:1px solid var(--line);margin:0}
#side .gladder li:last-child{border-bottom:0}
#side .gladder .n{width:24px;height:24px;border-radius:50%;border:2px solid #c3ccd6;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--mut);background:#fff}
#side .gladder li.past .n{background:#c3ccd6;border-color:#c3ccd6;color:#fff}#side .gladder li.on .n{background:var(--ink);border-color:var(--ink);color:#fff}
#side .gladder li.on>div>b{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}

/* ---------- phones and tablets ----------
   compact chrome, (max-width:1100px),(max-height:520px): a slim top bar, and the replay controls in a bar fixed to the bottom of the screen
   (1100px is the one-column break above; the theme-color meta in the head uses the same query).
   phone, (max-width:640px): compact content in one column, the side panel as a full-screen sheet, a county list beside the map.
   short screen, (max-height:520px): a landscape phone; a lower map and replay bar, and the popup in two columns.
   The script reads two of these widths (NARQ = 640px: county picker and list; FITQ = 1100px: charts drawn at the width they are shown,
   with a key under the series): keep them in step. Above 1100px wide and 520px high nothing below changes the page. */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.cpick{display:inline-flex;align-items:center;gap:8px;max-width:100%;border-radius:999px;padding:6px 13px 6px 14px;font-size:16px;font-weight:650;line-height:1.25;text-align:left}
.cpick i{font-style:normal;font-size:11px;color:var(--mut)}.cpick.active{border-color:var(--ink);box-shadow:0 0 0 2px #1c243022}
.crow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;margin:0 0 6px;padding:11px 12px 11px 14px;border-radius:10px;font-size:15px;text-align:left}
.crow.on{border-color:var(--ink);font-weight:700;box-shadow:0 0 0 2px #1c243022}
.crow>span:first-child{min-width:0}.crow small{display:block;font-size:12.5px;font-weight:400;line-height:1.35;color:var(--mut);margin-top:2px}.crow.on small,.crow.on .go{color:#ffffffc2}
#side .sec>h4 .st{letter-spacing:0;text-transform:none;font-size:12px;margin-right:4px}
.lnk.full{flex-basis:100%;margin:5px 0 0;font-size:12.5px}
.sleg{display:flex;flex-wrap:wrap;gap:3px 14px;align-items:center;font-size:12px;color:var(--mut);margin:4px 0 2px}.sleg span{white-space:nowrap}
.lg{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin:-2px 5px 0 0}.lg.dot{height:0;border-top:2px dotted var(--gap);border-radius:0;background:none}.lg.ring{width:9px;height:9px;border:2px solid var(--m4);border-radius:50%;background:#fff}
@media(pointer:coarse){
 html{touch-action:manipulation}   /* repeated taps (Next, Play) never zoom the page; pinch zoom stays */
 .info,#tourX,.ctl>button{position:relative}.info::after,#tourX::after{content:"";position:absolute;inset:-11px}.ctl>button::after{content:"";position:absolute;inset:-7px -2px}   /* finger-sized targets, same look */
 .chip{position:relative;padding:3px 10px}.chip::after{content:"";position:absolute;inset:-5px -1px}.hb .chip{padding:1px 8px}
 #tourF:hover{background:var(--ink);border-color:var(--ink)}#side .tools button:hover{background:#fff;color:var(--ink);border-color:var(--line)}   /* a tap leaves no hover colour behind */
}
