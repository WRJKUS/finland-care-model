<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper to Twin</title>
<style>
  :root { --bg: #89CFF0; }
  html, body { margin: 0; background: var(--bg); overflow: hidden; }
  canvas { display: block; }
  #ui { position: fixed; right: 12px; bottom: 12px; font: 12px "DejaVu Sans", sans-serif; color: #0E3B5C; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="ui"></div>
<script src="data.js"></script>
<script>
/* Two-minute film, deterministic: render(t) draws the frame at t seconds, so frames can be captured one by one.
   All numbers come from data.js (scripts/export_paper_film.py), or are quoted from Khalife et al. 2025 / MASTER_PROMPT.md.
   Naming: "Finland Cancer Plan Simulation" = Model 3 (strategy monitoring); "Simulation Using County Twins" = Model 4 (challenger). */
const cv = document.getElementById('c'), X = cv.getContext('2d');
const W = 1920, H = 1080;
const BB = '#89CFF0', BBL = '#BDE5F8', BBP = '#E6F5FD', BBD = '#4FA8D8', INK = '#0E3B5C', INK2 = '#2B6A92', WH = '#FFFFFF';
const GOLD = '#D4A537';
const F = '"DejaVu Sans", sans-serif', M = '"IBM Plex Mono", "DejaVu Sans Mono", monospace', SERIF = '"LM Roman 10", "Latin Modern Roman", Georgia, serif';
const S = D.summary, PM = D.policy_months;
const P3 = 'Finland Cancer Plan Simulation', P4 = 'Simulation Using County Twins';

// ---------- helpers ----------
const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const pr = (t, a, b) => cl((t - a) / (b - a));
const eo = p => 1 - Math.pow(1 - p, 3);
const eio = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const back = p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
const pct = v => Math.round(v * 100) + '%';
const MON = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
function rr(x, y, w, h, r) { X.beginPath(); X.roundRect(x, y, w, h, r); }
function fillRR(x, y, w, h, r, c) { rr(x, y, w, h, r); X.fillStyle = c; X.fill(); }
function fontOf(sz, o) { return `${o.st || ''} ${o.w || 'normal'} ${sz}px ${o.f || F}`.trim(); }
function txt(s, x, y, sz, c = INK, o = {}) {
  X.font = fontOf(sz, o); X.fillStyle = c; X.textAlign = o.a || 'left'; X.textBaseline = o.b || 'alphabetic';
  X.globalAlpha *= (o.al ?? 1); X.fillText(s, x, y); X.globalAlpha /= (o.al ?? 1) || 1;
}
function wrap(s, x, y, maxW, sz, lh, c = INK, o = {}) {
  X.font = fontOf(sz, o); const words = s.split(' '); let line = '', yy = y, n = 0;
  for (const w of words) { const tst = line ? line + ' ' + w : w; if (X.measureText(tst).width > maxW && line) { txt(line, x, yy, sz, c, o); line = w; yy += lh; n++; } else line = tst; }
  if (line) { txt(line, x, yy, sz, c, o); n++; } return n;
}
function measure(s, sz, o = {}) { X.font = fontOf(sz, o); return X.measureText(s).width; }
function alpha(a, fn) { if (a <= 0) return; X.save(); X.globalAlpha *= cl(a); fn(); X.restore(); }
function shift(dx, dy, fn) { X.save(); X.translate(dx, dy); fn(); X.restore(); }
function star(x, y, r, c) { X.beginPath(); for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, rr2 = i % 2 ? r * .32 : r; X.lineTo(x + Math.cos(a) * rr2, y + Math.sin(a) * rr2); } X.closePath(); X.fillStyle = c; X.fill(); }
function hash(i) { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function chip(x, y, s, sz, bg, fg, o = {}) { X.font = `${o.w || 'bold'} ${sz}px ${o.f || F}`; const w = X.measureText(s).width + sz * 1.2; fillRR(x, y, w, sz * 1.8, sz * .9, bg); txt(s, x + sz * .6, y + sz * 1.25, sz, fg, { w: o.w || 'bold', f: o.f }); return w; }
function check(x, y, s, ok) {
  X.save(); X.lineWidth = s * .16; X.lineCap = 'round'; X.strokeStyle = ok ? INK : '#B4413C'; X.beginPath();
  if (ok) { X.moveTo(x - s * .4, y); X.lineTo(x - s * .1, y + s * .3); X.lineTo(x + s * .45, y - s * .35); }
  else { X.moveTo(x - s * .35, y - s * .35); X.lineTo(x + s * .35, y + s * .35); X.moveTo(x + s * .35, y - s * .35); X.lineTo(x - s * .35, y + s * .35); }
  X.stroke(); X.restore();
}
// simple pictograms for the pathway steps
function pictogram(type, cx, cy, s, col) {
  X.save(); X.translate(cx, cy); X.strokeStyle = col; X.fillStyle = col; X.lineWidth = Math.max(2, s * .09); X.lineCap = 'round'; X.lineJoin = 'round';
  if (type === 'detect') { X.beginPath(); X.arc(-s * .08, -s * .08, s * .3, 0, 7); X.stroke(); X.lineWidth = s * .14; X.beginPath(); X.moveTo(s * .14, s * .14); X.lineTo(s * .4, s * .4); X.stroke(); }
  else if (type === 'refer') { X.strokeRect(-s * .42, -s * .28, s * .84, s * .56); X.beginPath(); X.moveTo(-s * .42, -s * .28); X.lineTo(0, s * .06); X.lineTo(s * .42, -s * .28); X.stroke(); }
  else if (type === 'diag') {
    X.beginPath(); X.moveTo(-s * .15, -s * .4); X.lineTo(-s * .15, s * .24); X.arc(0, s * .24, s * .15, Math.PI, 0, true); X.lineTo(s * .15, -s * .4); X.stroke();
    X.beginPath(); X.moveTo(-s * .26, -s * .4); X.lineTo(s * .26, -s * .4); X.stroke();
    X.beginPath(); X.moveTo(-s * .15, s * .02); X.lineTo(-s * .15, s * .24); X.arc(0, s * .24, s * .15, Math.PI, 0, true); X.lineTo(s * .15, s * .02); X.closePath(); X.globalAlpha *= .45; X.fill();
  }
  else if (type === 'treat') { const a = s * .13, b = s * .38; X.beginPath(); [[-a, -b], [a, -b], [a, -a], [b, -a], [b, a], [a, a], [a, b], [-a, b], [-a, a], [-b, a], [-b, -a], [-a, -a]].forEach(([x, y], i) => i ? X.lineTo(x, y) : X.moveTo(x, y)); X.closePath(); X.fill(); }
  X.restore();
}

// ---------- background: baby-blue gradient, drifting white bubbles ----------
function bg(t) {
  const g = X.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#9AD7F3'); g.addColorStop(.55, BB); g.addColorStop(1, '#74C2EA');
  X.fillStyle = g; X.fillRect(0, 0, W, H);
  for (let i = 0; i < 26; i++) {
    const r = 6 + hash(i) * 34, sp = 18 + hash(i + 9) * 40;
    const x = (hash(i + 3) * W + Math.sin(t * .5 + i) * 30) % W, y = H + 60 - ((t * sp + hash(i + 5) * (H + 200)) % (H + 200));
    X.beginPath(); X.arc(x, y, r, 0, 7); X.fillStyle = 'rgba(255,255,255,.13)'; X.fill();
    X.lineWidth = 2; X.strokeStyle = 'rgba(255,255,255,.28)'; X.stroke();
  }
}
function header(lt, kicker, title, sub) {
  const p = eo(pr(lt, 0, .7));
  alpha(p, () => shift(0, (1 - p) * -30, () => {
    if (kicker) chip(110, 62, kicker, 22, WH, INK2);
    txt(title, 110, 160, 56, WH, { w: 'bold' });
    if (sub) txt(sub, 112, 206, 26, INK, { al: .85 });
  }));
}
function caption(lt, dur, lines) {
  if (!lines || !lines.length) return;
  const i = Math.min(lines.length - 1, Math.floor(lt / (dur / lines.length)));
  const lp = lt - i * dur / lines.length, a = pr(lp, 0, .3) * (1 - pr(lt, dur - .35, dur));
  alpha(a, () => {
    X.font = `24px ${F}`; const w = Math.min(1640, X.measureText(lines[i]).width + 60);
    fillRR((W - w) / 2, H - 92, w, 54, 27, 'rgba(14,59,92,.82)');
    txt(lines[i], W / 2, H - 56, 24, WH, { a: 'center' });
  });
}
function source(s) { txt(s, W - 60, H - 112, 15, INK, { a: 'right', f: M, al: .75 }); }

// ---------- S0: toothbrush, title, and the paper we start from ----------
function toothbrush(t, cx, cy, sc, rot) {
  X.save(); X.translate(cx, cy); X.rotate(rot); X.scale(sc, sc);
  X.shadowColor = 'rgba(14,59,92,.25)'; X.shadowBlur = 30; X.shadowOffsetY = 14;
  rr(-430, -34, 640, 68, 34); const hg = X.createLinearGradient(0, -34, 0, 34); hg.addColorStop(0, '#B6E3F8'); hg.addColorStop(.5, BB); hg.addColorStop(1, BBD); X.fillStyle = hg; X.fill();
  X.shadowColor = 'transparent';
  for (let i = 0; i < 5; i++) fillRR(-360 + i * 46, -20, 22, 40, 11, 'rgba(255,255,255,.9)');
  rr(-430, -34, 640, 22, 20); X.fillStyle = 'rgba(255,255,255,.35)'; X.fill();
  X.beginPath(); X.moveTo(200, -26); X.quadraticCurveTo(260, -22, 300, -18); X.lineTo(300, 18); X.quadraticCurveTo(260, 22, 200, 26); X.closePath(); X.fillStyle = BBD; X.fill();
  fillRR(290, -36, 210, 64, 30, WH);
  for (let i = 0; i < 12; i++) {
    const bx = 304 + i * 16, wig = Math.sin(t * 22 + i * .8) * 4, h = 70 + (i % 2) * 10;
    rr(bx + wig * .3, -36 - h, 12, h + 6, 6); X.fillStyle = i % 2 ? WH : '#A8DCF5'; X.fill();
    X.lineWidth = 1.5; X.strokeStyle = 'rgba(79,168,216,.6)'; X.stroke();
    X.beginPath(); X.arc(bx + 6 + wig, -36 - h, 7, Math.PI, 0); X.fillStyle = i % 2 ? WH : '#A8DCF5'; X.fill();
  }
  X.lineWidth = 22; X.lineCap = 'round';
  for (let k = 0; k < 2; k++) {
    X.strokeStyle = k ? BBL : WH; X.beginPath();
    for (let i = 0; i <= 40; i++) { const u = i / 40, x = 300 + u * 190, y = -128 - Math.sin(u * Math.PI * 3 + t * 3) * 10 - k * 4; i ? X.lineTo(x, y) : X.moveTo(x, y); }
    X.stroke(); X.lineWidth = 9;
  }
  X.restore();
}
function S0(lt, dur) {
  const enter = back(pr(lt, 0, .8)), brush = pr(lt, .8, 2.1), BY = 400;
  const x = -500 + enter * 1300 + Math.sin(brush * Math.PI * 6) * 70 * (brush > 0 && brush < 1 ? 1 : 0);
  const rot = -0.18 + (1 - enter) * -0.5 + Math.sin(lt * 2) * .02;
  for (let i = 0; i < 34; i++) {
    const born = .8 + hash(i) * 1.5, age = lt - born; if (age < 0) continue;
    const bx = x + 220 + hash(i + 1) * 260 - 80 + Math.sin(age * 3 + i) * 20, by = BY - 150 - age * (70 + hash(i + 2) * 130);
    const r = (8 + hash(i + 3) * 24) * eo(cl(age * 2.5)), a = 1 - pr(age, 1.6, 2.8);
    alpha(a, () => { X.beginPath(); X.arc(bx, by, r, 0, 7); X.fillStyle = 'rgba(255,255,255,.75)'; X.fill(); X.lineWidth = 2; X.strokeStyle = WH; X.stroke();
      X.beginPath(); X.arc(bx - r * .35, by - r * .35, r * .22, 0, 7); X.fillStyle = WH; X.fill(); });
  }
  toothbrush(lt, x, BY, 1.0, rot);
  for (let i = 0; i < 9; i++) {
    const ts = 1.7 + i * .16, a = Math.sin(pr(lt, ts, ts + 1.1) * Math.PI);
    if (a > 0) star(260 + hash(i + 20) * 1400, 120 + hash(i + 30) * 420, 12 + 22 * a, i % 4 === 1 ? `rgba(242,210,113,${a})` : `rgba(255,255,255,${a})`);
  }
  const tp = eo(pr(lt, 2.0, 2.8)), pp = eo(pr(lt, 2.5, 3.3));
  alpha(tp, () => shift(0, (1 - tp) * 40, () => {
    txt('Equal Care Across Finland', W / 2, 668, 76, WH, { a: 'center', w: 'bold' });
    const gw = 300 * eo(pr(lt, 2.4, 3.2)); X.fillStyle = GOLD; X.fillRect(W / 2 - gw / 2, 694, gw, 3);
    txt('From a Nordic lung-cancer paper to county twins', W / 2, 744, 32, INK, { a: 'center' });
  }));
  alpha(pp, () => shift(0, (1 - pp) * 30, () => {
    fillRR(250, 778, 1420, 128, 22, 'rgba(255,255,255,.9)');
    chip(282, 796, 'THE PAPER WE START FROM', 15, INK, WH);
    txt('Comparative study of lung cancer care and survival outcomes across the Nordic countries', 282, 858, 25, INK, { w: 'bold' });
    txt('Khalife G, Warisa J, Bødtger U, et al. · Acta Oncologica 2025;64:42778 · doi 10.2340/1651-226X.2025.42778', 282, 886, 18, INK2);
    txt('Junction 2026 · AstraZeneca challenge · public aggregate data only', W / 2, 952, 20, INK, { a: 'center', al: .85 });
  }));
}

// ---------- 1 · the paper ----------
function S1(lt, dur) {
  header(lt, '1 · THE PAPER', 'Finland trails the Nordics on lung cancer', 'Khalife et al. 2025: a survey of Nordic lung-cancer clinicians, checked in two expert workshops');
  const q = eo(pr(lt, .3, 1.1));
  alpha(q, () => shift(0, (1 - q) * 40, () => {
    fillRR(110, 260, 1100, 600, 28, 'rgba(255,255,255,.22)');
    txt('Five-year lung-cancer survival, men', 150, 322, 30, WH, { w: 'bold' });
    txt('2018–2022', 150, 358, 22, INK);
    [['Finland', 16.7], ['Denmark', 26.2], ['Iceland', 28.4]].forEach((b, i) => {
      const g = eo(pr(lt, .7 + i * .25, 2.0 + i * .25)), bw = b[1] / 30 * 760 * g;
      fillRR(340, 410 + i * 120, 820, 76, 18, 'rgba(255,255,255,.25)'); fillRR(340, 410 + i * 120, Math.max(24, bw), 76, 18, i ? WH : INK);
      txt(b[0], 150, 460 + i * 120, 32, INK, { w: 'bold' }); txt((b[1] * g).toFixed(1) + '%', 340 + Math.max(24, bw) + 16, 462 + i * 120, 34, i ? WH : INK, { w: 'bold' });
    });
    txt('Finland’s figure has risen from 9.7% in 1998–2002, but is still the lowest.', 150, 812, 22, INK);
  }));
  const r = eo(pr(lt, 1.8, 2.6));
  alpha(r, () => shift((1 - r) * 60, 0, () => {
    fillRR(1250, 260, 560, 600, 28, WH);
    txt('Found at stage I', 1290, 322, 30, INK2, { w: 'bold' });
    txt('17%', 1290, 486, 150, INK, { w: 'bold' }); txt('Finland', 1294, 530, 26, INK);
    txt('over 25%', 1290, 680, 80, BBD, { w: 'bold' }); txt('Denmark and Norway', 1294, 722, 26, INK);
    wrap('Stage is recorded inconsistently in Finland, so early cancers may be even rarer.', 1290, 790, 490, 20, 26, INK2);
  }));
  caption(lt, dur, ['The paper compares lung-cancer care across the five Nordic countries.', 'Finland has the lowest survival, and finds the fewest cancers at stage I.']);
  source('Khalife et al. 2025 · 42 clinicians, Finland 12 (8 of 21 regions) · descriptive · funded by MSD Finland');
}
function S2(lt, dur) {
  header(lt, '1 · THE PAPER', 'Finland waits longest at every step', 'Typical waits reported by clinicians in each country (the paper’s Table 2)');
  const rows = [
    ['Health-centre appointment with symptoms', 14, '14 d', [2, 7], '2–7 d', 'detection'],
    ['GP → specialist consultation', [2, 4], '2–4 wk', [1, 2], '1–2 wk', 'referral'],
    ['Specialist → diagnosis', 4, '4 wk', [2, 4], '2–4 wk (SE 4)', 'diagnosis'],
  ];
  const max = [16, 5, 5];
  rows.forEach((r, i) => {
    const y = 290 + i * 170, a = eo(pr(lt, .3 + i * .5, 1.0 + i * .5));
    alpha(a, () => shift((1 - a) * -60, 0, () => {
      fillRR(110, y, 1700, 140, 26, i === 1 ? WH : 'rgba(255,255,255,.75)');
      chip(140, y + 20, r[5].toUpperCase(), 16, i === 1 ? INK : BB, WH);
      txt(r[0], 140, y + 96, 30, INK, { w: 'bold' });
      const bx = 1000, bw = 780, g = eo(pr(lt, .6 + i * .5, 1.9 + i * .5));
      const span = v => Array.isArray(v) ? v : [v, v];
      [[r[1], r[2], INK, 'Finland', 26], [r[3], r[4], BB, 'SE · DK · NO', 82]].forEach(([v, lab, col, who, dy]) => {
        const [lo, hi] = span(v); const x0 = bx + 150, x1 = x0 + hi / max[i] * (bw - 260) * g, xl = x0 + lo / max[i] * (bw - 260) * g;
        txt(who, bx, y + dy + 24, 20, INK2, { w: 'bold' });
        fillRR(x0, y + dy, Math.max(14, x1 - x0), 34, 17, col === INK ? INK : BB);
        if (hi > lo) fillRR(x0, y + dy, Math.max(14, xl - x0), 34, 17, col === INK ? '#245C80' : BBD);
        txt(lab, x1 + 14, y + dy + 26, 22, INK, { w: 'bold' });
      });
    }));
  });
  const b = eo(pr(lt, 2.6, 3.4));
  alpha(b, () => {
    fillRR(110, 812, 1700, 92, 24, INK);
    txt('Doctor at first contact', 150, 870, 28, WH, { w: 'bold' });
    txt('Finland 40–60%', 560, 870, 34, BB, { w: 'bold' }); txt('Sweden 80–100%   ·   DK, NO, IS 100%', 900, 870, 28, WH);
  });
  caption(lt, dur, ['The gap opens at the front of the pathway: getting seen, and getting referred.', 'After the specialist, Finland’s 4 weeks to diagnosis matches Sweden’s.']);
  source('Khalife et al. 2025, Table 2');
}
function S3(lt, dur) {
  header(lt, '1 · THE PAPER', 'And Finland does not watch its outcomes', 'Outcome tracking and access to a doctor, from the paper’s results and discussion');
  const cards = [
    ['No', 'national lung-cancer quality register', 'Sweden, Denmark, Norway and Iceland all have one.'],
    ['0 of 8', 'Finnish hospital respondents report survival tracking', 'Swedish and Danish hospitals discuss outcomes regularly.'],
    ['35%', 'waited over 14 days for a primary-care doctor (2023)', '14% waited 1–3 months. Figures from THL, Finland’s public-health institute.'],
  ];
  cards.forEach((c, i) => {
    const a = back(pr(lt, .3 + i * .45, 1.1 + i * .45)), x = 110 + i * 580;
    X.save(); X.translate(x + 270, 580); X.scale(cl(a, 0, 1.2), cl(a, 0, 1.2)); X.translate(-(x + 270), -580);
    fillRR(x, 256, 540, 660, 32, WH);
    txt(c[0], x + 40, 430, 140, INK, { w: 'bold' });
    wrap(c[1], x + 40, 530, 470, 34, 44, INK2, { w: 'bold' });
    wrap(c[2], x + 40, 760, 470, 25, 34, INK);
    X.restore();
  });
  caption(lt, dur, ['Registry data arrives late, and hospitals do not close the loop.', 'Caution: the experts said a few weeks of waiting does not explain the survival gap.']);
  source('Khalife et al. 2025, Table 3 and Discussion (THL Avohilmo, ref. 31)');
}

// ---------- 2 · what a county twin is ----------
const GEO = D.geo;
const GC = Object.fromEntries(GEO.map(f => { const big = f.rings.reduce((a, r) => r.length > a.length ? r : a, []); let sx = 0, sy = 0; big.forEach(p => { sx += p[0]; sy += p[1]; }); return [f.code, [sx / big.length, sy / big.length]]; }));
function countyPath(f, ox, oy, sc) { X.beginPath(); for (const ring of f.rings) { ring.forEach((p, i) => i ? X.lineTo(ox + p[0] * sc, oy + p[1] * sc) : X.moveTo(ox + p[0] * sc, oy + p[1] * sc)); X.closePath(); } }
const STATIONS = [
  { name: 'Detection', icon: 'detect', what: 'Finding cancer early: screening and first symptoms', watch: 'Share of invited people who attend screening', paper: 'paper: 17% found at stage I' },
  { name: 'Referral', icon: 'refer', what: 'The GP refers the patient; a hospital specialist assesses the referral', watch: 'Share waiting over 90 days for that first assessment', paper: 'paper: 2–4 weeks to a specialist' },
  { name: 'Diagnosis', icon: 'diag', what: 'Tests that confirm the cancer, such as endoscopy', watch: 'Share waiting over 90 days for endoscopy', paper: 'paper: 4 weeks, as in Sweden' },
  { name: 'Treatment', icon: 'treat', what: 'Surgery or cancer drugs begin', watch: 'The oncology queue and surgery waits', paper: 'paper: survival is not tracked' },
];
function S4(lt, dur) {
  header(lt, '2 · THE TWIN', 'What a county twin is', 'One county, never a patient: a small model of its cancer pathway, updated every month from public figures.');
  const CTL = D.county, Lr = CTL.live.ref_assess_over90, RM = D.replay_months;
  // the mini replay in the lower half decides when the referral step lights up
  const i0 = RM.indexOf('2019-01-31'), i1 = RM.indexOf('2021-01-31'), m = i1 - i0;
  const playM = eio(pr(lt, 7.6, 12.0)) * m, ic = i0 + Math.floor(playM);
  let ig = -1; for (let i = i0; i <= i1; i++) if (Lr.status[i] === 'gap') { ig = i; break; }
  const ga = ig >= 0 && ic >= ig ? eo(cl((i0 + playM - ig) / 1.2)) : 0;
  // map: one twin per county
  const ox = 140, oy = 262, sc = 620;
  GEO.forEach((f, i) => {
    const a = eo(pr(lt, .2 + i * .035, .7 + i * .035)); if (a <= 0) return;
    alpha(a, () => {
      countyPath(f, ox, oy, sc);
      const sel = f.code === CTL.code, hl = sel ? eo(pr(lt, 1.6, 2.2)) : 0;
      X.fillStyle = sel ? `rgba(14,59,92,${0.12 + 0.5 * hl + 0.38 * ga})` : 'rgba(255,255,255,.93)'; X.fill();
      X.lineWidth = 1.3; X.strokeStyle = BBD; X.stroke();
    });
  });
  GEO.forEach((f, i) => {
    const a = eo(pr(lt, 1.0 + i * .02, 1.4 + i * .02)), c = GC[f.code]; if (a <= 0) return;
    const x = ox + c[0] * sc, y = oy + c[1] * sc, pulse = .5 + .5 * Math.sin(lt * 4 + i), sel = f.code === CTL.code;
    alpha(a, () => {
      if (sel && ga > 0) { X.beginPath(); X.arc(x, y, 14 + 10 * pulse, 0, 7); X.fillStyle = `rgba(255,255,255,${.35 * ga})`; X.fill(); }
      X.beginPath(); X.arc(x, y, 4.5 + 2 * pulse, 0, 7); X.fillStyle = sel ? WH : INK; X.fill();
    });
  });

// ---------- timeline: [scene, seconds on screen, seconds it was designed for] ----------
const SCENES = [[S0, 7], [S1, 7], [S2, 8], [S3, 7], [S4, 15], [SL, 15], [S5, 17], [S6, 10], [SA, 8, 11], [SE, 8, 11], [SF, 7], [SZ, 11]];
let acc = 0; const TL = SCENES.map(([f, d, d0]) => { const o = { f, d, d0: d0 || d, t0: acc }; acc += d; return o; });
window.DURATION = acc;
window.render = function (t) {
  X.setTransform(1, 0, 0, 1, 0, 0); X.globalAlpha = 1; X.letterSpacing = '0px'; bg(t);
  const i = TL.findIndex(s => t < s.t0 + s.d); const s = TL[i === -1 ? TL.length - 1 : i]; const lt = Math.min(t - s.t0, s.d);
  const fin = pr(lt, 0, .45), fout = 1 - pr(lt, s.d - .35, s.d);
  X.save(); X.globalAlpha = Math.min(fin, fout); X.translate(0, (1 - eo(fin)) * 24);
  s.f(lt * s.d0 / s.d, s.d0); X.restore();
  X.fillStyle = 'rgba(255,255,255,.7)'; X.fillRect(0, H - 6, W * t / acc, 6);
};

else if (!q.has('capture')) { const t0 = performance.now(); (function loop() { const t = ((performance.now() - t0) / 1000) % acc; render(t); document.getElementById('ui').textContent = t.toFixed(1) + ' / ' + acc + ' s'; requestAnimationFrame(loop); })(); }
